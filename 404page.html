<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Error</title>
 <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 10px;
        background: #bdbcbc;
    }

    .container {
        width: 100%;
        max-width: 1200px;
        text-align: center;
    }

    .container img {
        width: 100%;
        height: auto;
    }

    @media (max-width: 480px) {
        .container {
            max-width: 95%;
        }
    }

    @media (min-width: 481px) and (max-width: 768px) {
        .container {
            max-width: 80%;
        }
    }

    @media (min-width: 769px) and (max-width: 1024px) {
        .container {
            max-width: 700px;
        }
    }

    @media (min-width: 1025px) {
        .container {
            max-width: 900px;
        }
    }

    @media (min-width: 1440px) {
        .container {
            max-width: 1100px;
        }
    }
</style>
</head>
<body>
    
        <div class="container">
            <img src="./Assets/Blue and White Illustrative 404 Page Desktop Prototype.svg" alt="">
        </div>
    
</body>
</html>
